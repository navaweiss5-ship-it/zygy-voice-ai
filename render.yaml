services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"3\",\"g\":\"היי ציפוש מה קורה? מה תרצי לשאול?\",\"x\":\"\"},{\"p\":\"2\",\"m\":\"2\",\"g\":\"היי ציפוש מה קורה? מה תרצי לשאול?\",\"x\":\"\"},{\"p\":\"3\",\"m\":\"1\",\"g\":\"היי ציפוש מה קורה? מה תרצי לשאול?\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "261"
      - key: EXTRA_INSTRUCTION
        value: "קרא למתקשר ציפי"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
